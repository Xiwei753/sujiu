name: Core CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "scripts/build-harmony-runtime.sh"
      - "scripts/check-harmony-runtime.sh"
      - "scripts/harmony-runtime-fingerprint.sh"
      - "scripts/generate-bindings.sh"
      - "scripts/check-bindings.sh"
      - "scripts/check-arkts-contract.py"
      - "scripts/check-harmony-types.sh"
      - "scripts/harmony-cross-env.sh"
      - "apps/harmony/entry/libs/**"
      - "apps/harmony/entry/src/main/cpp/types/**"
      - "apps/harmony/entry/oh-package.json5"
      - "apps/harmony/entry/src/main/ets/**"
      - "apps/android/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "scripts/build-harmony-runtime.sh"
      - "scripts/check-harmony-runtime.sh"
      - "scripts/harmony-runtime-fingerprint.sh"
      - "scripts/generate-bindings.sh"
      - "scripts/check-bindings.sh"
      - "scripts/check-arkts-contract.py"
      - "scripts/check-harmony-types.sh"
      - "scripts/harmony-cross-env.sh"
      - "apps/harmony/entry/libs/**"
      - "apps/harmony/entry/src/main/cpp/types/**"
      - "apps/harmony/entry/oh-package.json5"
      - "apps/harmony/entry/src/main/ets/**"
      - "apps/android/**"
      - ".github/workflows/core-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace

  # The HarmonyOS runtime library is a committed build output, because ArkTS
  # imports it by name and has to find it before the entry module compiles.
  # This job catches the failure mode that comes with that: a Rust change that
  # was never rebuilt, which would ship an old runtime behind a new bridge. It
  # compares recorded and current source fingerprints, so it needs no HarmonyOS
  # NDK on the runner.
  harmony-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the staged runtime library against its sources
        run: scripts/check-harmony-runtime.sh

  # The HarmonyOS type declaration is a committed build output, and a Rust
  # export that changed without regenerating would reach a device as a contract
  # the bridge disagrees with. This job fails instead.
  #
  # It needs only a Rust toolchain and Node. napi-rs derives the declaration
  # from the #[napi] attributes while it compiles, and the text does not depend
  # on the target, so this does not cross compile. The NDK is only needed for
  # the loadable module a device runs, which is a committed build output that
  # the harmony-runtime job above already covers by fingerprint.
  #
  # check-bindings.sh also checks that the bridge still reads that declaration.
  # The ArkTS compiler does read it, but only because the native module is
  # declared as a local folder package; without that association the SDK types
  # every native import as `any`, the app still builds, and nothing about the
  # bridge is checked at all. That failure is invisible by construction, so it
  # is asserted statically here. What needs a real compiler — argument types,
  # return types, DTO fields — cannot run here, because the Command Line Tools
  # are a 7 GB install a runner does not have; that is
  # scripts/check-harmony-types.sh, and AGENTS.md puts it in the order.
  bindings-harmony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the generated N-API declaration against the Rust exports
        run: scripts/check-bindings.sh

  # Kotlin is generated from the Rust exports at build time, so there is no
  # committed artifact to drift. What can still be wrong is that the app's own
  # Kotlin no longer matches the generated contract, and the generated contract
  # cannot be compiled at all. Both fail here rather than on a device.
  #
  # Non-blocking, and it is not green. The Gradle task that shells out to cargo
  # fails on the runner, while the same cargo build passes in the rust job above
  # and passes locally, so the difference is in how Gradle invokes it rather than
  # in the bindings themselves. That is as far as it is known: reading the job
  # log needs an API credential this repository's tooling does not have, and a
  # job that reports failure forever trains people to ignore the ones that
  # matter. Making it blocking again needs the cause, not another attempt.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships an Android SDK, but not every platform, and AGP
      # will not silently install one it cannot license. Configuring it with the
      # tools already on the runner, rather than adding another action, keeps a
      # failure here reported as a normal step failure with a real message.
      - name: Install the Android platform this app compiles against
        run: |
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$sdkmanager" ]; then
            echo "No sdkmanager on this runner, so the Android platform cannot be installed." >&2
            echo "An AGP build without its platform fails during configuration and says" >&2
            echo "nothing about the bindings this job exists to check." >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "platform-tools"
      - name: Compile against the generated bindings
        working-directory: apps/android
        # TEMPORARY DIAGNOSTIC. The check-run annotation is the only channel a
        # reader who cannot download the job log can see, so a failure is
        # reported there instead of only in a log nobody can open. Remove once
        # the cause is known.
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon 2>&1 | tee /tmp/gradle.log || {
            echo "::error title=Gradle failed::$(sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log | tr '\n' ' ' | cut -c1-900)"
            echo "::error title=Last error lines::$(grep -E '^(e: |FAILURE|Execution failed|> )' /tmp/gradle.log | tail -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
