[workspace]
members = [
    "crates/sujiu-core",
    "crates/sujiu-codec",
    "crates/sujiu-ai",
    "crates/sujiu-ffi",
  "crates/sujiu-napi",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0"
rust-version = "1.82"

[workspace.dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
